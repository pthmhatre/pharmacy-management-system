{% extends 'base.html' %}
{% load static %}

{% block title %}Logged Out - MediCare Pharmacy{% endblock %}

{% block content %}
<section class="logout-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 text-center">
                    <div class="card-body p-5">
                        <i class="fas fa-sign-out-alt fa-5x text-primary mb-4"></i>
                        <h2 class="mb-3">You've Been Logged Out</h2>
                        <p class="text-muted mb-4">Thank you for visiting MediCare Pharmacy. We hope to see you again soon!</p>
                        
                        <div class="d-grid gap-2">
                            <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login Again
                            </a>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-home"></i> Go to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
